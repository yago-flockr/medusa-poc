packages:
  - "apps/**"
  - "packages/**"
  - "!apps/backend/.medusa/**"

# Trust the starter lockfile so pnpm 11 does not re-verify every entry
# against registry supply-chain policies (that pass hung the installer).
trustLockfile: true

overrides:
  "@types/react": "19.0.5"
  "@types/react-dom": "19.0.5"
  # Engines require node >=22 (see root/backend package.json); pinning one
  # @types/node instance workspace-wide avoids duplicate installs that make
  # cross-package generic types (e.g. @ts-rest/core's branded types) go
  # structurally incompatible between packages.
  "@types/node": "22.19.2"

allowBuilds:
  '@medusajs/telemetry': true
  # false: only used for `graphql-codegen --watch`, which we don't run —
  # no need to grant it a native build script for the one-shot codegen we do use.
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
