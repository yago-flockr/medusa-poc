packages:
  - "apps/**"
  - "!apps/backend/.medusa/**"

# Trust the starter lockfile so pnpm 11 does not re-verify every entry
# against registry supply-chain policies (that pass hung the installer).
trustLockfile: true

overrides:
  "@types/react": "19.0.5"
  "@types/react-dom": "19.0.5"

allowBuilds:
  '@medusajs/telemetry': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
