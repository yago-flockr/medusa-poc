name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: apps/backend
        run: npx medusa lint

      - name: Unit tests
        working-directory: apps/backend
        run: pnpm run test:unit
