info:
  name: Auth
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/user/emailpass"
  body:
    type: json
    data: |-
      {
        "email": "{{admin_email}}",
        "password": "{{admin_password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
